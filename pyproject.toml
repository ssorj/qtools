[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssorj-qtools"
version = "1.0.1"
authors = [
  { name = "Justin Ross", email = "jross@apache.org" },
]
description = "Command-line tools for sending and receiving AMQP 1.0 messages"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "LICENSE.txt" ]
keywords = [ "amqp", "cli", "messaging", "qpid", "proton" ]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = [ "python-qpid-proton" ]

[project.optional-dependencies]
dev = [ "build", "twine" ]

[project.scripts]
qconnect = "qtools.connect:main"
qsend = "qtools.send:main"
qreceive = "qtools.receive:main"
qrequest = "qtools.request:main"
qrespond = "qtools.respond:main"
qmessage = "qtools.message:main"
qbroker = "qtools.brokerlib:main"
qtools-self-test = "qtools.tests:main"

[project.urls]
"Homepage" = "https://github.com/ssorj/qtools"
"Documentation" = "https://github.com/ssorj/qtools#readme"
"Source" = "https://github.com/ssorj/qtools"
"Bug Tracker" = "https://github.com/ssorj/qtools/issues"
"Changelog" = "https://github.com/ssorj/qtools/commits/main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
qtools = [ "testcerts/*.pem" ]
