name: main
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        version: ["3.9", "3.x"]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.version}}
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pip install dist/ssorj_qtools-*.whl
        shell: bash
      - run: python -m pytest -m "not tls"
        if: ${{matrix.os == 'macos-latest'}}
      - run: python -m pytest
        if: ${{matrix.os == 'ubuntu-latest'}}
